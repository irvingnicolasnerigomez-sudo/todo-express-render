<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <div style="text-align: center; margin-bottom: 20px;">
        <p style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #718096; margin-bottom: 4px;">
            Bienvenido a mi docker
        </p>
        <p style="font-size: 1.1rem; font-weight: 600; color: #4f46e5;">
            Irving Nicolas Neri Gomez
        </p>
        <hr style="border: 0; height: 1px; background: #e2e8f0; margin-top: 15px; width: 50%; margin-left: auto; margin-right: auto;">
    </div>

    <h1>Gestor de Tareas</h1>

    <button id="openModalBtn" class="add-btn">
        ➕ Nueva Tarea
    </button>

    <ul id="taskList"></ul>

</div>

<div id="taskModal" class="modal">

    <div class="modal-content">

        <h2>Nueva Tarea</h2>

        <input
            type="text"
            id="taskName"
            placeholder="Nombre de la tarea"
        >

        <input
            type="number"
            id="taskTime"
            placeholder="Tiempo estimado (horas)"
        >

        <input
            type="date"
            id="taskDate"
        >

        <div class="modal-buttons">

            <button id="saveTaskBtn">
                Guardar
            </button>

            <button id="closeModalBtn">
                Cancelar
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
